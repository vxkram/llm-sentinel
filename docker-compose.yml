services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: ["sh", "-c", "sleep 3 && ollama pull llama3.2:1b"]
    restart: "no"

  mock-openai:
    build:
      context: .
      dockerfile: docker/mock_provider.Dockerfile
      args:
        MOCK_PROVIDER: openai
    ports:
      - "8011:8000"

  mock-anthropic:
    build:
      context: .
      dockerfile: docker/mock_provider.Dockerfile
      args:
        MOCK_PROVIDER: anthropic
    ports:
      - "8012:8000"

  gateway:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    ports:
      - "8010:8010"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OPENAI_MOCK_BASE_URL=http://mock-openai:8000
      - ANTHROPIC_MOCK_BASE_URL=http://mock-anthropic:8000
    depends_on:
      - ollama
      - mock-openai
      - mock-anthropic

volumes:
  ollama-data:
