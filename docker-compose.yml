services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: ["sh", "-c", "sleep 3 && ollama pull llama3.2:1b"]
    restart: "no"

  mock-openai:
    build:
      context: .
      dockerfile: docker/mock_provider.Dockerfile
      args:
        MOCK_PROVIDER: openai
    ports:
      - "8011:8000"

  mock-anthropic:
    build:
      context: .
      dockerfile: docker/mock_provider.Dockerfile
      args:
        MOCK_PROVIDER: anthropic
    ports:
      - "8012:8000"

  gateway:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    ports:
      - "8010:8010"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OPENAI_MOCK_BASE_URL=http://mock-openai:8000
      - ANTHROPIC_MOCK_BASE_URL=http://mock-anthropic:8000
      - REDIS_URL=redis://redis:6379/0
      - OTLP_ENDPOINT=http://jaeger:4318/v1/traces
    depends_on:
      - redis
      - ollama
      - mock-openai
      - mock-anthropic
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686" # UI
      - "4318:4318" # OTLP HTTP receiver

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./observability/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml
    depends_on:
      - gateway
      - alertmanager

  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - "9093:9093"
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards/json
    depends_on:
      - prometheus

volumes:
  ollama-data:
