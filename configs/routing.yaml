# Canonical model -> provider + wire-level model id, grouped into tiers.
# Fallback chains are defined per tier (not per specific model) so the
# gateway can always find an available option within a tier.
models:
  llama3.2:
    provider: ollama
    wire_model: llama3.2:1b
    tier: fast
  gpt-4o-mini:
    provider: openai
    wire_model: gpt-4o-mini
    tier: fast
  claude-3-5-sonnet:
    provider: anthropic
    wire_model: claude-3-5-sonnet-20241022
    tier: premium

tiers:
  fast:
    fallback_chain:
      - llama3.2
      - gpt-4o-mini
  premium:
    fallback_chain:
      - gpt-4o-mini
      - claude-3-5-sonnet
      - llama3.2
